version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR per group keeps patch noise low while security bumps stay visible.
      production:
        patterns: ["*"]
        dependency-type: production
      development:
        patterns: ["*"]
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
